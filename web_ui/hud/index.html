<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Overvolt Garage — Run HUD</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Anton&family=Baloo+2:wght@700;800&family=Rubik:wght@500;600;700;800&display=swap"
  rel="stylesheet"
/>

<link rel="stylesheet" href="../shared/tokens.css" />
<link rel="stylesheet" href="../shared/components.css" />
<link rel="stylesheet" href="hud.css" />
<link rel="stylesheet" href="../shared/card_select/card_select.css" />
<link rel="stylesheet" href="../shared/blob_toast/blob_toast.css" />
</head>
<body>

<div id="app">
  <!-- Top-left: hearts + timer + level/XP -->
  <div class="og-hud-topbar">
    <div class="og-hud-panel og-hud-hearts" id="hud-hearts"></div>
    <div class="og-hud-panel og-hud-timer" id="hud-timer">1:00</div>
    <div class="og-hud-panel og-hud-level">
      <span id="hud-level">Lv 1</span>
      <div class="og-hud-xpbar"><div class="og-hud-xpbar__fill" id="hud-xp-fill"></div></div>
    </div>
  </div>

  <!-- Top-right: blob counter + pause -->
  <div class="og-hud-topright">
    <div class="og-hud-panel og-hud-blobs">
      <span class="og-hud-blobs__icon"><img src="../../assets/sprites/allan/frames/player_idle0.png" alt="" /></span>
      <span id="hud-blobs">0</span>
    </div>
    <button id="hud-pause-btn" class="og-icon-btn og-pressable"></button>
  </div>

  <!-- Boss warning banner -->
  <div class="og-hud-boss-warn" id="hud-boss-warn">BOSS INCOMING</div>

  <!-- Boss health bar -->
  <div class="og-hud-boss-bar-wrap" id="hud-boss-bar-wrap">
    <div class="og-hud-boss-name" id="hud-boss-name">BOSS</div>
    <div class="og-hud-boss-bar"><div class="og-hud-boss-bar__fill" id="hud-boss-fill"></div></div>
  </div>

  <!-- Dev buttons (debug builds only) -->
  <div class="og-hud-dev" id="hud-dev">
    <button class="og-btn og-btn--ghost og-pressable" id="hud-dev-win">DEV: Win</button>
    <button class="og-btn og-btn--ghost og-pressable" id="hud-dev-die">DEV: Die</button>
  </div>

  <!-- Death panel -->
  <div class="og-popup-backdrop og-hud-death" id="hud-death-backdrop">
    <div class="og-popup-panel og-hud-death-panel">
      <div class="og-hud-death-title og-headline" style="color:#ff3d3d;">ALLAN DIED</div>
      <div class="og-hud-death-face" id="hud-death-face"></div>
      <button class="og-btn og-btn--caution og-pressable" id="hud-ad-continue" style="width:100%;">Watch ad to continue</button>
      <button class="og-btn og-btn--ghost og-pressable" id="hud-ascend" style="width:100%;margin-top:8px;">Ascend to Base</button>
    </div>
  </div>

  <!-- Ascend / run-end count-up overlay -->
  <div class="og-hud-ascend" id="hud-ascend-overlay">
    <div class="og-hud-ascend__title og-headline og-headline--caution" id="hud-ascend-title">ASCENDING TO HEAVEN...</div>
    <div class="og-hud-ascend__count" id="hud-ascend-count">+0 Blobs</div>
    <div class="og-hud-ascend__total" id="hud-ascend-total">Total: 0</div>
  </div>

  <!-- Pause overlay -->
  <div class="og-popup-backdrop og-hud-pause" id="hud-pause-backdrop">
    <div class="og-popup-panel" style="text-align:center;">
      <div class="og-headline" style="font-size:28px;margin-bottom:16px;">PAUSED</div>
      <button class="og-btn og-btn--caution og-pressable" id="hud-resume" style="width:220px;margin-bottom:10px;">RESUME</button>
      <br/>
      <button class="og-btn og-btn--ghost og-pressable" id="hud-quit-hub" style="width:220px;">QUIT TO HUB</button>
    </div>
  </div>
</div>

<div id="popup-cardselect-root"></div>
<div id="popup-blobtoast-root"></div>

<script src="../shared/bridge.js"></script>
<script src="../shared/assets.js"></script>
<script src="../shared/icons.js"></script>
<script src="../shared/allan_sheet.js"></script>
<script src="../shared/card_select/card_select.js"></script>
<script src="../shared/blob_toast/blob_toast.js"></script>
<script src="hud.js"></script>
</body>
</html>
