name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}
env:
  GODOT_VERSION: "4.7"
  EXPORT_NAME: "game"
  EXPORT_PRESET: "Android"
jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot
          ln -sf /root/.local/share/godot/export_templates ~/.local/share/godot/export_templates
      - name: Configure Android SDK paths
        run: |
          mkdir -pv "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          EOF
      - name: Create output directory
        run: mkdir -v -p build/android
      - name: Install template + Export debug APK
        run: |
          godot --headless --install-android-build-template \
            --export-debug "${EXPORT_PRESET}" build/android/${EXPORT_NAME}.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/android/*.apk
          if-no-files-found: error
