name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Rust cross-compile on the BARE runner (curl/rustup available).
  # The godot-ci container has no curl -> rustup dies with exit 127 (run #51).
  rust-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Cross-compile Rust GDExtension for Android (arm64)
        working-directory: addons/godot-rust
        run: |
          cargo ndk \
            -t arm64-v8a \
            -o target/android \
            build --release
          ls -lh target/android/arm64-v8a/libmy_extension.so

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-android-so
          path: addons/godot-rust/target/android/arm64-v8a/libmy_extension.so

  godot-export:
    needs: rust-android
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7
    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot
          ln -sf /root/.local/share/godot/export_templates ~/.local/share/godot/export_templates

      - name: Configure Android SDK paths
        run: |
          mkdir -pv "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          EOF

      - name: Strip dev-only MCP autoload (godot_ai not shipped)
        run: |
          sed -i '/_mcp_game_helper/d' project.godot
          sed -i 's|, "res://addons/godot_ai/plugin.cfg"||' project.godot
          grep -n "godot_ai\|_mcp_game_helper" project.godot || echo "godot_ai references stripped"

      - name: Download Rust .so
        uses: actions/download-artifact@v4
        with:
          name: rust-android-so
          path: addons/godot-rust/target/android/arm64-v8a

      - name: Stamp version code/name from run number
        run: |
          sed -i "s|^version/code=.*|version/code=${{ github.run_number }}|" export_presets.cfg
          sed -i "s|^version/name=.*|version/name=\"1.0.${{ github.run_number }}\"|" export_presets.cfg
          grep -E "^version/(code|name)" export_presets.cfg

      - name: Import project resources
        run: godot --headless --import

      - name: Export debug APK
        run: |
          mkdir -p export
          ls -lh addons/godot-rust/target/android/arm64-v8a/libmy_extension.so
          godot --headless --export-debug Android export/AL67X-debug.apk
          ls -lh export/AL67X-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AL67X-android-debug
          path: export/AL67X-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          name: Beta build #${{ github.run_number }}
          body: |
            Auto-built debug APK for testing.
            Install on your phone via Obtain or sideload.
          files: export/AL67X-debug.apk
          prerelease: true
