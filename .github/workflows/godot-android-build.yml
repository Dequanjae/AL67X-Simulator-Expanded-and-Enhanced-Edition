name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.7

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Cross-compile Rust GDExtension for Android (arm64)
        working-directory: addons/rust
        run: |
          cargo ndk \
            -t arm64-v8a \
            -o target/android \
            build --release
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Verify .so was produced
        run: |
          ls -lh addons/rust/target/android/arm64-v8a/libmy_extension.so

      - name: Export debug APK
        run: |
          mkdir -p export
          godot --headless \
            --export-debug Android export/AL67X-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AL67X-android-debug
          path: export/AL67X-debug.apk
