name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: "game"          # base name of the exported apk (no extension)
  EXPORT_PRESET: "Android"     # must match the preset name in export_presets.cfg

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify export templates
        run: ls -la ~/.local/share/godot/export_templates/

      - name: Setup Java and Android SDK
        run: |
          apt-get update -qq
          apt-get install -y -qq openjdk-17-jdk unzip
          mkdir -p /root/android-sdk/cmdline-tools/latest
          curl -sLo /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/_android
          mv /tmp/_android/cmdline-tools/* /root/android-sdk/cmdline-tools/latest/
          rm -rf /tmp/cmdline-tools.zip /tmp/_android
          yes | /root/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/root/android-sdk \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android-keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android-keystore/release.keystore

      - name: Configure Godot Android signing (editor settings)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          mkdir -pv ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/root/android-sdk"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/debug_keystore = "android-keystore/release.keystore"
          export/android/debug_keystore_user = "${KEYSTORE_ALIAS}"
          export/android/debug_keystore_pass = "${KEYSTORE_PASSWORD}"
          export/android/release_keystore = "android-keystore/release.keystore"
          export/android/release_keystore_user = "${KEYSTORE_ALIAS}"
          export/android/release_keystore_pass = "${KEYSTORE_PASSWORD}"
          EOF

      - name: Create output directory
        run: mkdir -v -p build/android

      - name: Import project
        run: godot --headless --verbose --import

      - name: Export APK
        run: |
          godot --headless --verbose --export-release "${EXPORT_PRESET}" \
            build/android/${EXPORT_NAME}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/android/*.apk
          if-no-files-found: error
